logging:
  level:
    blog: WARN
    org: WARN
    org.hibernate.SQL: DEBUG
spring:
  datasource:
    driverClassName: com.mysql.cj.jdbc.Driver
    password: ${DB_PASSWORD:pass}
    url: jdbc:mysql://localhost:3306/object_mapping?useSSL=false&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:root}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
